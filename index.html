<!DOCTYPE html>
<html lang="id" data-theme="dark" style="color-scheme: dark;"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>E-Portofolio PPG_Anggelita Ronauli</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
:root{--bg1:#ffe3f1;--bg2:#d9f0ff;--bg3:#fff6c9;--card:#fff;--ink:#4a3b5c;--soft:#8b7a9e;--line:#f3c6e0;--pink:#ff7eb6;--mint:#7ee8c0;--shadow:0 8px 0 rgba(180,120,200,.25);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg1:#3a2245;--bg2:#1f2f4d;--bg3:#3d3a26;--card:#2e2640;--ink:#fbeaff;--soft:#c3afd6;--line:#5d4378;--shadow:0 8px 0 rgba(0,0,0,.35)}}
:root[data-theme="dark"]{color-scheme:dark;--bg1:#3a2245;--bg2:#1f2f4d;--bg3:#3d3a26;--card:#2e2640;--ink:#fbeaff;--soft:#c3afd6;--line:#5d4378;--shadow:0 8px 0 rgba(0,0,0,.35)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:'Fredoka','Comic Sans MS',system-ui,sans-serif;color:var(--ink);background:linear-gradient(135deg,var(--bg1),var(--bg2),var(--bg3));background-size:300% 300%;animation:bg 14s ease infinite;overflow-x:hidden;min-height:100vh}
@keyframes bg{50%{background-position:100% 100%}}
.float{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.float span{position:absolute;bottom:-60px;font-size:28px;animation:up linear infinite;opacity:.8}
@keyframes up{to{transform:translateY(-115vh) rotate(360deg)}}
#cover{position:relative;z-index:1;max-width:980px;margin:0 auto;padding:20px 16px 40px}
.hero{background:var(--card);border-radius:36px;box-shadow:var(--shadow);border:4px solid var(--line);overflow:hidden;text-align:center;animation:pop .7s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.coverimg{height:230px;background:repeating-linear-gradient(45deg,var(--bg1),var(--bg1) 14px,var(--bg2) 14px,var(--bg2) 28px) center/cover;display:grid;place-items:center;cursor:pointer;position:relative}
.coverimg .hint{background:var(--card);padding:10px 18px;border-radius:99px;font-weight:600;animation:bob 2s ease-in-out infinite;box-shadow:0 4px 0 var(--line)}
.coverimg.has .hint{opacity:0;transition:.3s;position:absolute;bottom:12px}
.coverimg.has:hover .hint{opacity:1}
@keyframes bob{50%{transform:translateY(-8px)}}
h1{margin:14px 12px 2px;font-size:clamp(26px,6vw,44px);cursor:pointer}
h1 span{display:inline-block;animation:wave 2s ease-in-out infinite}
@keyframes wave{50%{transform:translateY(-8px) rotate(-6deg)}}
.sub{color:var(--soft);margin:0 0 18px;padding:0 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:18px;margin-top:26px}
.ico{border:0;background:none;font:inherit;color:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:8px;padding:6px;animation:drop .6s backwards cubic-bezier(.3,1.6,.5,1)}
@keyframes drop{from{transform:translateY(-40px) scale(.3);opacity:0}}
.ico .sq{width:84px;height:84px;border-radius:26px;display:grid;place-items:center;font-size:42px;box-shadow:var(--shadow);border:3px solid #fff8;transition:.25s;animation:idle 3s ease-in-out infinite}
@keyframes idle{50%{transform:translateY(-6px) rotate(3deg)}}
.ico:hover .sq{transform:scale(1.18) rotate(-8deg);animation:none}
.ico:active .sq{transform:scale(.9)}
.ico b{font-size:13px;line-height:1.2;font-weight:600;max-width:120px}
#view{position:fixed;inset:0;z-index:10;background:linear-gradient(160deg,var(--bg1),var(--bg2));overflow:auto;display:none;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.bar{position:sticky;top:0;z-index:3;display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--card);border-bottom:4px solid var(--line)}
.bar h2{margin:0;font-size:clamp(14px,3.6vw,20px);flex:1}
.home{border:0;background:var(--pink);color:#fff;font:inherit;font-weight:700;padding:10px 18px;border-radius:99px;cursor:pointer;box-shadow:0 5px 0 #d94f8c}
.home:active{transform:translateY(4px);box-shadow:0 1px 0 #d94f8c}
.body{max-width:860px;margin:0 auto;padding:20px 16px 60px;animation:fade .5s .25s backwards}
@keyframes fade{from{opacity:0;transform:translateY(20px)}}
.box{background:var(--card);border:3px dashed var(--line);border-radius:26px;padding:16px;margin-bottom:18px}
.box h3{margin:0 0 10px}
input,textarea{width:100%;font:inherit;color:var(--ink);background:transparent;border:3px solid var(--line);border-radius:16px;padding:10px 14px;outline:0;transition:.2s}
input:focus,textarea:focus{border-color:var(--pink);transform:scale(1.015)}
textarea{min-height:160px;resize:vertical}
label{display:block;font-weight:600;margin:12px 0 4px;color:var(--soft)}
.btn{border:0;font:inherit;font-weight:600;background:var(--mint);color:#1d4d3c;border-radius:99px;padding:10px 18px;cursor:pointer;box-shadow:0 4px 0 #3fb98d;white-space:nowrap}
.btn:active{transform:translateY(3px);box-shadow:none}
.row{display:flex;gap:8px;margin-top:10px}
.links{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.lk{display:flex;gap:12px;align-items:center;background:var(--bg1);border-radius:20px;padding:12px;text-decoration:none;color:inherit;animation:pop .5s cubic-bezier(.3,1.6,.5,1);position:relative;transition:.2s}
.lk:hover{transform:translateY(-4px) rotate(-1deg)}
.lk .em{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;font-size:26px;flex:none}
.lk small{display:block;color:var(--soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:140px}
.lk b{display:block}
.x{position:absolute;top:-8px;right:-8px;border:0;background:#ff6b6b;color:#fff;width:26px;height:26px;border-radius:50%;cursor:pointer;font-weight:700}
.imgbox{min-height:200px;border-radius:22px;background:repeating-linear-gradient(45deg,var(--bg1),var(--bg1) 12px,var(--bg2) 12px,var(--bg2) 24px) center/cover;display:grid;place-items:center;cursor:pointer;text-align:center;border:3px dashed var(--line)}
.imgbox.has{border-style:solid;min-height:260px}
.imgbox span{background:var(--card);padding:10px 16px;border-radius:99px;font-weight:600;animation:bob 2s infinite}
.avatar{width:140px;height:140px;border-radius:50%;margin:0 auto 10px;display:grid;place-items:center;font-size:56px;background:var(--bg2) center/cover;border:5px solid var(--pink);cursor:pointer;animation:bob 3s infinite;box-shadow:var(--shadow)}
.end{text-align:center;font-size:64px}
.spark{position:fixed;z-index:20;pointer-events:none;font-size:22px;animation:sp .8s ease-out forwards}
@keyframes sp{to{transform:translate(var(--x),var(--y)) scale(.2) rotate(200deg);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important}}
.ro .row,.ro .x,.ro .coverimg .hint,.ro .imgbox:not(.has) span{display:none}.ro .coverimg,.ro h1,.ro .imgbox,.ro .avatar{cursor:default}
#pub{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:40;display:none;gap:10px;align-items:center;background:var(--card);border:3px solid var(--line);padding:8px 10px 8px 16px;border-radius:99px;box-shadow:var(--shadow);font-size:13px;font-weight:600;white-space:nowrap}
body:not(.ro) #pub{display:flex}
</style>
</head>

<main id="cover">
  <section class="hero">
    <div class="coverimg" id="cimg"><div class="hint">📸 Klik untuk tambah gambar cover</div></div>
    <h1 id="ttl"></h1>
    <p class="sub">Pendidikan Profesi Guru • Klik ikon untuk membuka ✨</p>
  </section>
  <div class="grid" id="grid"></div>
</main>

Pg6ofAqMsZ5CzYt1N3pacLJyTn+EciUgjdxNnjm1FFXN1PDMYja2WX/3LJ1bmxxaPUXBuNkOjZGx7Ii4Pa0B1jflRRRWbBYP9ux3EuLtOouJ3JXN67BHjuljxwYmPxRMWsNDXZ3CiiDV0vIkd0tkrnanNIbv6FZn4cA6xCNFjWNiooqRkikfB1PIx4zUccupg9CHLf1seH1qdreHEON+pCii55/2114/74z9lCoovA+iHelKCiiCUjQ5UUQLwdk6iiCXsiCoogYGwUasKKIEJo0ooog//2Q==","nama":"ANGGELITA RONAULI","nim":"200572510073","prodi":"PPG/PGSD","pt":"UNIVERSITAS NEGERI JAKARTA","sekolah":"SDN Tugu Utara 22","kelas":"Semester I : III-C, Semester 2 : IV-B","tahun":"2026","a1d":["https://drive.google.com/file/d/1YDu0jG9BCV7AevB2C3CqfCZVAZwRzIVV/view?usp=drivesdk","https://drive.google.com/file/d/1QWd4GM75AC1s2VnbNfVH0RwdUGBWpivR/view?usp=drivesdk"],"a1o":["https://www.instagram.com/reel/DcN2MoczCOR/?xtok=MWU5OTBzaDBwZHE0cw=="],"n1t":"Analisis Kegiatan Pembelajaran Siklus 1\n\nBerdasarkan hasil pengamatan terhadap dokumentasi kegiatan pembelajaran Matematika kelas IV pada materi perkalian dan pembagian bilangan cacah, dapat diketahui bahwa pelaksanaan pembelajaran telah menunjukkan upaya untuk menciptakan suasana belajar yang aktif, interaktif, dan berpusat pada peserta didik. Guru mengawali kegiatan dengan memberikan penguatan konsep perkalian sebagai penjumlahan berulang dan pembagian sebagai pengurangan berulang. Peserta didik diberikan kesempatan untuk menyelesaikan contoh soal melalui papan tulis sehingga mereka dapat menunjukkan pemahaman awal terhadap materi yang dipelajari.\n\nPada kegiatan inti, guru menerapkan aktivitas pembentukan kelompok menggunakan potongan LKPD. Peserta didik diminta mencari potongan yang sesuai dengan potongan milik teman lainnya, kemudian menyusun dan menempelkannya pada kertas karton hingga membentuk LKPD yang utuh. Kegiatan ini memberikan pengalaman belajar yang menarik karena peserta didik terlibat secara langsung dalam proses pembentukan kelompok. Setelah kelompok terbentuk, peserta didik bekerja sama menyelesaikan soal-soal yang terdapat dalam LKPD. Aktivitas tersebut mencerminkan penerapan pembelajaran berkesadaran (mindful), bermakna (meaningful), dan menggembirakan (joyful).\n\nDitinjau dari penggunaan perangkat pembelajaran, bahan ajar yang mengangkat tema restoran telah mendukung penyampaian materi karena memberikan contoh penerapan perkalian dan pembagian dalam kehidupan sehari-hari. Sementara itu, LKPD berfungsi sebagai media latihan yang membantu peserta didik menerapkan konsep melalui berbagai soal cerita. Keterkaitan antara bahan ajar dan LKPD terlihat dari penggunaan konteks makanan, meja, kursi, serta pembagian makanan secara merata. Dengan demikian, peserta didik memperoleh kesempatan untuk memahami konsep sekaligus mengaplikasikannya dalam pemecahan masalah.\n\nMeskipun demikian, masih terdapat beberapa aspek yang perlu ditingkatkan. Penggunaan benda konkret dalam pembelajaran perlu lebih dioptimalkan agar peserta didik memperoleh pengalaman belajar yang lebih lengkap melalui benda nyata, gambar, dan simbol matematika. Selain itu, instrumen asesmen perlu disesuaikan dengan tujuan pembelajaran, khususnya dalam mengukur kemampuan perkalian dan pembagian. Guru juga perlu memastikan seluruh peserta didik berpartisipasi aktif dalam kegiatan kelompok serta memberikan evaluasi individu untuk mengetahui tingkat pemahaman masing-masing.\n\nSecara keseluruhan, pembelajaran Siklus 1 telah menunjukkan penggunaan strategi, bahan ajar, dan LKPD yang saling mendukung dalam menciptakan pembelajaran matematika yang lebih kontekstual dan menyenangkan. Penggunaan aktivitas kolaboratif dan soal cerita menjadi kekuatan dalam pembelajaran ini. Hasil analisis tersebut dapat dijadikan bahan refleksi untuk meningkatkan kualitas pembelajaran pada kegiatan berikutnya, terutama dalam penguatan pemahaman konsep, optimalisasi media konkret, dan kesesuaian asesmen dengan tujuan pembelajaran.","n1g":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/4gHYSUNDX1BST0ZJTEUAAQEAAAHIAAAAAAQwAABtbnRyUkdCIFhZWiAH4AABAAEAAAAAAABhY3NwAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAQAA9tYAAQAAAADTLQAAAAAAAAAAAAAAAAAAAAA ikan permasalahan di papan tulis. Murid terlihat melakukan kegiatan menentukan faktor suatu bilangan dan menyusun pola kelipatan. Beberapa murid juga memperoleh kesempatan untuk mempresentasikan hasil pekerjaannya di depan kelas.\nPenggunaan media pembelajaran menjadi salah satu aspek yang mendukung pelaksanaan pembelajaran Siklus 2. Media Bus Pengangkut Faktor dan Kelipatan, permainan ular tangga, serta kartu latihan dirancang untuk membantu murid memahami materi melalui pengalaman belajar yang lebih konkret dan menyenangkan. Kegiatan pembelajaran kelompok juga memberikan kesempatan kepada murid untuk berinteraksi, bekerja sama, dan bertukar pendapat dalam menyelesaikan permasalahan.\nBahan ajar yang digunakan telah memuat penjelasan mengenai pengertian faktor dan kelipatan, cara menentukan faktor dan kelipatan, hubungan antara keduanya, serta penerapannya dalam kehidupan sehari-hari. LKPD juga telah menyediakan variasi latihan yang mencakup kemampuan menentukan faktor, menemukan kelipatan, dan mengidentifikasi hubungan antara kedua konsep tersebut. Dengan demikian, perangkat ajar secara umum telah mendukung tujuan pembelajaran yang ditetapkan.\n\nDari aspek pembelajaran mendalam, kegiatan yang dilaksanakan telah mencerminkan prinsip Mindful Learning melalui penyampaian tujuan dan kegiatan refleksi, Meaningful Learning melalui penerapan konsep faktor dan kelipatan dalam situasi sehari-hari, serta Joyful Learning melalui penggunaan media permainan dan kegiatan kelompok. Hal ini memberikan pengalaman belajar yang lebih aktif dan bervariasi bagi murid.\nMeskipun demikian, masih terdapat beberapa aspek yang perlu ditingkatkan, terutama dalam pemerataan keterlibatan murid, penguatan kemampuan menjelaskan alasan dalam menentukan jawaban, konsistensi penggunaan media dengan perangkat ajar, serta penguatan asesmen individu. Guru juga perlu memastikan bahwa setiap murid tidak hanya mampu memperoleh jawaban yang benar, tetapi juga memahami proses dan alasan matematis di balik jawaban tersebut.\n\nSecara keseluruhan, pembelajaran Siklus 2 menunjukkan pelaksanaan yang telah mengarah pada pembelajaran aktif, interaktif, kolaboratif, dan berpusat pada murid. Penggunaan media visual dan permainan menjadi faktor pendukung dalam menciptakan pengalaman belajar yang lebih menarik serta membantu murid memahami materi faktor dan kelipatan.","n2g":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/4gHYSUNDX1BST0ZJTEUAAQEAAAHIAAAAAAQwAABtbnRyUkdCIFhZWiAH4AABAAEAAAAAAABhY3NwAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAQAA9tYAAQAAAADTLQAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAlkZXNjAAAA8AAAACRyWFlaAAABFAAAABRnWFlaAAABKAAAABRiWFlaAAABPAAAABR3dHB0AAABUAAAABRyVFJDAAABZAAAAChnVFJDAAABZAAAAChiVFJDAAABZAAAAChjcHJ0AAABjAAAADxtbHVjAAAAAAAAAAEAAAAMZW5VUwAAAAgAAAAcAHMAUgBHAEJYWVogAAAAAAAAb6IAADj1AAADkFhZWiAAAAAAAABimQAAt4UAABjaWFlaIAAAAAAAACSgAAAPhAAAts9YWVogAAAAAAAA9tYAAQAAAADTLXBhcmEAAAAAAAQAAAACZmYAAPKnAAANWQAAE9AAAApbAAAAAAAAAABtbHVjAAAAAAAAAAEAAAAMZW5VUwAAACAAAAAcAEcAbwBvAGcAbABlACAASQBuAGMALgAgADIAMAAxADb/2wBDAAkGBwgHBgkIBwgKCgkLDRYPDQwMDRsUFRAWIB0iIiAdHx8kKDQsJCYxJx8fLT0tMTU3Ojo6Iys/RD84QzQ5Ojf/2wBDAQoKCg0MDRoPDxo3JR8lNzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzf/wAARCAJ8A4MDASIAAhEBAxEB/8QAHAAAAAcBAQAAAAAAAAAAAAAAAAECAwQFBgcI/8QAVRAAAgEDAgMFBQUFBAgFAQIPAQIDAAQRBSEGEjETQVFhcQcigZGhFDKxwdEVI0JSYjNy4fAWJENTgpKisjRjc8Lx0gg1VJPiFyU2RGR0s0ZVZYOj/8QAGwEAAgMBAQEAAAAAAAAAAAAAAAQBAgMFBgf/xAA3EQACAgEEAAQEAwgDAAMBAQAAAQIDEQQSITEFE0FRIjJhcRSBoRUjQpGxwdHwM1LhBjTxJGL/2gAMAwEAAhEDEQA/AOn0S/eagWUd4+dJR15m94fOmRIcoCk8y/zD50fOv8w+dQSD+IelHS44JZWBRCRjr3VMj07vlkx5LUOSRZQb6K+nI7aaYgohI8TsKa1XiHh7Qsrd3URnUf2S+/J8h0+OKzr8darq5dOHNKxEDy/aLg/dPoDgfM+lUlYorc+F9S8aG3g1/wBghhjMt7MqIoyxzgAeZNUWocdaJphNvpiPfXJ2VLZchj4Fu/4Zqgfh/UdWlWbiLVZbgg5EMRwg/L5Cruw0yy09OWzt0j8WAyx9Sd65Wo8XphxH4n+g9VopevBCtp+KuJLtBcSJpdmxyIEzzkeZ6/DI9KXrnBtzBF2tg5uQFy6EYf1Hj+PrWi0cf64D4KTT2oXDJdtytjlA7/KmvC9XZbHzWl2Y62qMVs5wzkkiMjsrgqynBBGCDWr9muf2xc//AMOf+5a0GqWWl6vAWvY /1NhsAR5HYXAyU6Pqwc8dR1ZrefrJj-uRZ/view?usp=drivesdk","https://drive.google.com/file/d/173DU_xejt-94eTVMX_eKYbWJHIOpkPVu/view?usp=drivesdk","https://drive.google.com/file/d/1Kzu3HuA373FMqnUkPxSMXIt74an7YqKv/view?usp=drivesdk"],"a3o":["https://www.instagram.com/reel/DeQYIZlhxxE/?dlrf=NmxsOHNodzh5Y2Js"],"n3t":"Analisis Pembelajaran Siklus 3\n\nPelaksanaan pembelajaran Siklus 3 pada mata pelajaran Matematika kelas IV dengan materi Pecahan dengan Penyebut Sama dan Pecahan Senilai dirancang melalui RPM yang mengintegrasikan model Problem Based Learning (PBL) dan pendekatan Deep Learning. Perencanaan pembelajaran telah disusun secara sistematis dengan memperhatikan karakteristik dan kebutuhan belajar murid, tujuan pembelajaran, langkah-langkah kegiatan, serta asesmen. Pembelajaran diarahkan agar murid tidak hanya mengenali konsep pecahan, tetapi juga mampu membandingkan, mengurutkan, menentukan, dan mencocokkan pecahan senilai melalui gambar, benda konkret, serta lambang matematika. Penggunaan pendekatan pembelajaran bermakna, berkesadaran, dan menggembirakan juga menjadi upaya untuk menciptakan pengalaman belajar yang lebih aktif dan menyenangkan.\n\nDari segi bahan ajar, materi disajikan secara visual dan menggunakan bahasa yang sederhana sehingga sesuai dengan karakteristik perkembangan murid kelas IV. Penjelasan mengenai pecahan dengan penyebut sama menggunakan contoh seperti 1/6, 3/6, dan 5/6, sedangkan materi pecahan senilai ditunjukkan melalui hubungan 1/2 = 2/4 = 3/6 = 4/8. Penggunaan ilustrasi lingkaran, persegi, serta bagian yang diarsir membantu murid memahami hubungan antara pembilang, penyebut, dan nilai suatu pecahan. Media pembelajaran juga dikembangkan melalui PPT, kartu soal, dan kartu soal bonus yang memberikan variasi kegiatan belajar. Sementara itu, penyediaan LKPD reguler dan LKPD inklusi menunjukkan adanya upaya mengakomodasi perbedaan kebutuhan belajar murid melalui aktivitas pengerjaan soal dan pencocokan gambar dengan lambang pecahan. Dengan demikian, keterpaduan bahan ajar dan media pembelajaran mendukung penyampaian konsep matematika secara lebih konkret dan mudah dipahami.\n\nBerdasarkan dokumentasi video pembelajaran, terlihat bahwa guru telah memanfaatkan PPT yang ditampilkan melalui proyektor untuk membantu menjelaskan materi pecahan. Penggunaan media visual memberikan gambaran kepada murid mengenai konsep pecahan dan membantu mengarahkan perhatian mereka selama proses pembelajaran. Dalam cuplikan video juga terlihat adanya interaksi murid dengan media pembelajaran serta aktivitas yang melibatkan penggunaan lembar kerja. Hal tersebut menunjukkan adanya upaya untuk melibatkan murid dalam kegiatan belajar, bukan hanya melalui kegiatan mendengarkan penjelasan guru. Namun, keterlibatan aktif murid masih perlu terus ditingkatkan melalui kegiatan diskusi, eksplorasi menggunakan kartu soal, penyelesaian masalah, dan kesempatan menyampaikan alasan dari jawaban yang diperoleh. Selain itu, penerapan sintaks PBL, khususnya pada tahap penyelidikan, pengembangan hasil, dan evaluasi pemecahan masalah, perlu diperkuat agar pelaksanaan pembelajaran semakin sesuai dengan model yang telah direncanakan.\n\nDari hasil analisis keseluruhan perangkat dan pelaksanaan pembelajaran, terdapat beberapa kelebihan yang terlihat, yaitu perencanaan pembelajaran yang terstruktur, penggunaan media yang bervariasi, penyajian materi melalui ilustrasi konkret, serta tersedianya asesmen diagnostik, proses, dan akhir pembelajaran. Penggunaan kartu soal dan kartu bonus juga memberikan kesempatan kepada murid untuk berlatih serta memperoleh tantangan tambahan sesuai dengan tingkat pemahamannya. Meskipun demikian, terdapat beberapa aspek yang perlu diperbaiki, seperti memperkuat keterlibatan dan kemandirian murid, memperjelas instruksi pengerjaan LKPD, meningkatkan kemampuan penalaran matematis, serta memastikan kesesuaian antara materi yang disampaikan dengan tujuan pembelajaran. Penilaian juga perlu memperhatikan proses berpikir murid, bukan hanya ketepatan jawaban akhir, sehingga guru dapat mengetahui sejauh mana murid benar-benar memahami konsep pecahan dan mampu menerapkannya dalam menyelesaikan permasalahan.\n\nSecara keseluruhan, pembelajaran Siklus 3 menunjukkan adanya upaya untuk mengembangkan proses pembelajaran matematika yang lebih menarik, variatif, dan berorientasi pada pemahaman konsep. Melalui penggunaan PPT, kartu soal, LKPD, serta pendekatan pembelajaran yang melibatkan aktivitas murid, diharapkan pemahaman mengenai pecahan dengan penyebut sama dan pecahan senilai dapat berkembang secara lebih optimal. Refleksi dari pelaksanaan pembelajaran ini memberikan pemahaman bahwa keberhasilan pembelajaran tidak hanya ditentukan oleh kelengkapan perangkat dan menariknya media yang digunakan, tetapi juga oleh kemampuan guru dalam menciptakan interaksi, membimbing proses berpikir, dan mengakomodasi kebutuhan belajar setiap murid. Oleh karena itu, perbaikan pembelajaran selanjutnya perlu difokuskan pada peningkatan aktivitas eksplorasi, penguatan diskusi dan pemecahan masalah, penerapan asesmen yang lebih menyeluruh, serta pemberian kesempatan kepada murid untuk mengonstruksi dan mengomunikasikan pemahamannya secara mandiri. Dengan demikian, pembelajaran diharapkan tidak hanya menghasilkan penguasaan materi, tetapi juga mengembangkan kemampuan berpikir kritis, komunikasi, kolaborasi, dan kemandirian murid.","n3g":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/4gHYSUNDX1BST0ZJTEUAAQEAAAHIAAAAAAQwAABtbnRyUkdCIFhZWiAH4AABAAEAAAAAAABhY3NwAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAQAA9tYAAQAAAADTLQAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAlkZXNjAAAA8AAAACRyWFlaAAABFAAAABRnWFlaAAABKAAAABRiWFlaAAABPAAAABR3dHB0AAABUAAAABRyVFJDAAABZAAAAChnVFJDAAABZAAAAChiVFJDAAABZAAAAChjcHJ0AAABjAAAADxtbHVjAAAAAAAAAAEAAAAMZW5VUwAAAAgAAAAcAHMAUgBHAEJYWVogAAAAAAAAb6IAADj1AAADkFhZWiAAAAAAAABimQAAt4UAABjaWFlaIAAAAAAAACSgAAAPhAAAts9YWVogAAAAAAAA9tYAAQAAAADTLXBhcmEAAAAAAAQAAAACZmYAAPKnAAANWQAAE9AAAApbAAAA kegiatan berlangsung. Hal ini menunjukkan adanya interaksi antara guru dan peserta didik, sekaligus memberikan ruang bagi peserta didik untuk terlibat secara langsung dalam proses menemukan dan memahami konsep pecahan desimal.\n\nSalah satu kegiatan yang menarik dalam video adalah penggunaan media permainan HERODES (Hebat Roda Desimal Seru). Peserta didik terlihat diarahkan untuk berinteraksi dengan papan spinner dan menggunakan kartu soal sebagai bagian dari aktivitas pembelajaran. Penggunaan permainan ini memberikan variasi dalam kegiatan belajar sehingga peserta didik tidak hanya menerima penjelasan secara verbal, tetapi juga memperoleh kesempatan untuk mencoba menyelesaikan tantangan secara langsung. Aktivitas tersebut berpotensi meningkatkan antusiasme, keberanian, kerja sama, dan keterlibatan peserta didik dalam pembelajaran matematika.\n\n2. Analisis Media PowerPoint\n\nMedia PowerPoint yang digunakan memiliki desain visual yang menarik, berwarna, dan dilengkapi ilustrasi yang sesuai dengan karakteristik peserta didik sekolah dasar. Materi disusun secara sistematis, dimulai dari apersepsi mengenai pecahan dalam kehidupan sehari-hari, pengenalan persepuluh dan perseratus, pemahaman nilai tempat, mengubah pecahan biasa menjadi pecahan desimal, membandingkan pecahan desimal, hingga penjumlahan dan pengurangan pecahan desimal. Materi kemudian dihubungkan dengan penerapan dalam kehidupan sehari-hari serta diakhiri dengan kesimpulan dan refleksi diri.\n\nKeunggulan media PowerPoint ini terletak pada penggunaan berbagai bentuk representasi, seperti gambar kue yang dibagi menjadi sepuluh bagian, cokelat yang dibagi menjadi seratus bagian, kotak berpetak, garis bilangan, tabel nilai tempat, dan ilustrasi pengukuran. Penyajian tersebut membantu peserta didik memahami bahwa pecahan desimal bukan sekadar angka yang ditulis menggunakan tanda koma, tetapi memiliki hubungan dengan bagian-bagian dari suatu keseluruhan. Penggunaan warna yang berbeda untuk menunjukkan satuan, persepuluh, dan perseratus juga membantu peserta didik membedakan nilai tempat setiap angka.\n\nSelain itu, penyajian contoh soal secara bertahap memberikan kesempatan kepada peserta didik untuk memahami hubungan antara pecahan biasa dan pecahan desimal. Materi perbandingan serta penjumlahan dan pengurangan juga dilengkapi dengan ilustrasi dan langkah pengerjaan sehingga dapat membantu peserta didik mengikuti proses penyelesaian soal. Bagian kesimpulan dan refleksi diri menjadi komponen penting karena memberikan kesempatan kepada peserta didik untuk meninjau kembali materi serta mengidentifikasi kemampuan yang sudah dikuasai dan yang masih perlu ditingkatkan.\n\n3. Analisis Bahan Ajar\n\nBahan ajar disajikan dalam bentuk infografis satu halaman dengan pembagian materi yang jelas dan penggunaan ilustrasi pendukung. Isi bahan ajar mencakup pengertian persepuluh dan perseratus, hubungan pecahan biasa dengan pecahan desimal, nilai tempat, perbandingan pecahan desimal, perubahan pecahan biasa menjadi desimal, perubahan desimal menjadi pecahan biasa, operasi penjumlahan dan pengurangan, serta penerapan pecahan desimal dalam kehidupan sehari-hari.\n\nBahan ajar ini memiliki keunggulan karena menyajikan informasi secara ringkas dan terstruktur sehingga dapat digunakan sebagai sumber belajar pendamping selama proses pembelajaran. Peserta didik dapat mengamati gambar, membaca penjelasan, dan membandingkan beberapa contoh secara langsung. Misalnya, hubungan antara 3/10 dengan 0,3 serta 25/100 dengan 0,25 ditampilkan melalui gambar yang menunjukkan bagian-bagian yang diarsir. Representasi tersebut membantu menghubungkan pemahaman visual dengan simbol matematika.\n\nBahan ajar juga mengaitkan materi dengan situasi nyata, seperti pengukuran panjang, berat benda, dan penggunaan nilai uang. Keterkaitan tersebut membuat pembelajaran menjadi lebih kontekstual karena peserta didik dapat menemukan penggunaan pecahan desimal dalam kehidupan sehari-hari. Dengan demikian, bahan ajar tidak hanya mendukung pemahaman konsep, tetapi juga membantu peserta didik mengetahui manfaat mempelajari pecahan desimal dalam aktivitas sehari-hari.\n\n4. Analisis Media Permainan Spinner HERODES\n\nMedia Spinner HERODES merupakan media pembelajaran berbasis permainan yang dirancang untuk memberikan pengalaman belajar yang lebih aktif dan menyenangkan. Media ini dilengkapi dengan beberapa kelompok kartu soal, di antaranya mengubah bilangan desimal menjadi pecahan berpenyebut 100 dan 1.000, mengubah pecahan menjadi bilangan desimal, menentukan penyebut, membandingkan nilai pecahan, serta mengarsir gambar sesuai nilai pecahan yang diminta.\n\nKeunggulan media ini adalah memberikan variasi aktivitas yang tidak hanya berfokus pada kemampuan menghitung, tetapi juga melatih pemahaman konsep, ketelitian, keberanian menjawab, dan kemampuan bekerja sama. Melalui sistem permainan menggunakan spinner, peserta didik memperoleh tantangan soal yang bervariasi. Adanya kartu tantangan teman dan kartu bonus juga dapat digunakan untuk membangun suasana kelas yang lebih menyenangkan serta meningkatkan interaksi antarpeserta didik.\n\nPenggunaan HERODES memberikan kesempatan kepada peserta didik untuk menerapkan pengetahuan yang telah diperoleh melalui PowerPoint dan bahan ajar ke dalam kegiatan latihan. Guru juga dapat mengamati kemampuan peserta didik dalam menjawab soal, memahami instruksi, serta menjelaskan alasan dari jawaban yang diberikan. Dengan demikian, media ini dapat dimanfaatkan sebagai sarana latihan sekaligus asesmen formatif untuk mengetahui perkembangan pemahaman peserta didik.\n\n5. Analisis Keterpaduan Video dan Media Pembelajaran\n\nSecara keseluruhan, kegiatan pembelajaran dan perangkat media yang digunakan menunjukkan keterpaduan antara penyampaian materi, pemberian contoh, kegiatan latihan, dan aktivitas permainan. PowerPoint berfungsi sebagai media penyampaian materi secara visual dan sistematis, bahan ajar berperan sebagai sumber informasi pendamping, sedangkan Spinner HERODES digunakan untuk memberikan pengalaman praktik dan penguatan pemahaman melalui kegiatan bermain sambil belajar.\n\nDalam video, penggunaan papan tulis, lembar kerja atau kartu soal, serta media Spinner HERODES terlihat mendukung kegiatan pembelajaran yang melibatkan peserta didik secara langsung. Peserta didik tidak hanya menjadi penerima informasi, tetapi juga memperoleh kesempatan untuk mengerjakan soal, berdiskusi, dan berinteraksi dengan media pembelajaran. Perpaduan tersebut menunjukkan bahwa pembelajaran dirancang dengan memanfaatkan beberapa bentuk media agar materi lebih mudah dipahami melalui pengalaman belajar yang beragam.\n\nMeskipun demikian, berdasarkan cuplikan video yang tersedia, penggunaan PowerPoint dan bahan ajar cetak tidak terlihat secara jelas selama proses pembelajaran. Oleh karena itu, keterlibatan kedua media tersebut dalam pelaksanaan pembelajaran belum dapat diamati secara langsung. Video juga merupakan cuplikan singkat sehingga belum cukup untuk menilai keseluruhan tahapan pembelajaran maupun tingkat penguasaan materi oleh seluruh peserta didik.\n\n6. Kelebihan dan Hal yang Perlu Ditingkatkan\n\nBeberapa kelebihan pembelajaran Siklus 4 dapat dilihat dari penggunaan media yang bervariasi, penyajian materi secara visual, pengaitan konsep matematika dengan kehidupan sehari-hari, serta penerapan permainan edukatif. Aktivitas kelompok dan penggunaan spinner memberikan ruang bagi peserta didik untuk berpartisipasi, berinteraksi, dan mengembangkan rasa percaya diri. Selain itu, adanya kegiatan refleksi pada PowerPoint membantu membangun kesadaran peserta didik terhadap kemampuan belajarnya sendiri.\n\nNamun, terdapat beberapa hal yang masih dapat ditingkatkan. Pertama, tujuan pembelajaran perlu disampaikan secara lebih eksplisit pada awal kegiatan agar peserta didik mengetahui kompetensi yang harus dicapai. Kedua, kepadatan informasi pada beberapa halaman PowerPoint dan bahan ajar perlu diperhatikan agar seluruh tulisan tetap mudah dibaca dan dipahami. Ketiga, penggunaan kartu soal pada Spinner HERODES yang membahas pecahan berpenyebut 1.000 perlu diberikan sebagai materi pengayaan atau didahului penjelasan tentang nilai perseribu, karena fokus utama pembelajaran adalah persepuluh dan perseratus.\n\nSelain itu, guru perlu memastikan setiap peserta didik memperoleh kesempatan yang seimbang untuk mengikuti permainan dan menjawab pertanyaan. Pemberian umpan balik setelah peserta didik menjawab soal juga penting agar kesalahan konsep dapat segera diperbaiki. Penilaian sebaiknya tidak hanya didasarkan pada keberhasilan kelompok menyelesaikan permainan, tetapi juga dilengkapi dengan latihan individu untuk mengetahui tingkat pemahaman masing-masing peserta didik.\n\n7. Kesimpulan Analisis Pembelajaran Siklus 4\n\nBerdasarkan hasil analisis terhadap video dan perangkat media pembelajaran, dapat disimpulkan bahwa pembelajaran Siklus 4 telah menunjukkan upaya menciptakan kegiatan belajar matematika yang lebih menarik, interaktif, dan berpusat pada keterlibatan peserta didik. Penggunaan PowerPoint, bahan ajar visual, dan permainan Spinner HERODES memberikan variasi pengalaman belajar yang saling melengkapi, mulai dari memahami konsep, mengamati representasi gambar, mengerjakan latihan, hingga menerapkan pengetahuan melalui permainan edukatif.\n\nPembelajaran ini memberikan gambaran bahwa penggunaan media yang tepat dapat membantu menjembatani konsep matematika yang bersifat abstrak menjadi lebih konkret dan mudah dipahami oleh peserta didik sekolah dasar. Namun, efektivitas pembelajaran tetap perlu diperkuat melalui pengelolaan waktu, pemerataan partisipasi, pemberian umpan balik, serta asesmen individu yang sesuai dengan tujuan pembelajaran. Dengan demikian, pembelajaran Siklus 4 menjadi salah satu bentuk pengembangan praktik pembelajaran yang mengintegrasikan media visual, aktivitas kolaboratif, dan permainan edukatif untuk menciptakan pengalaman belajar matematika yang lebih bermakna.","end":"REFLEKSI AKHIR E-PORTOFOLIO\n\nRefleksi Artefak dan Analisis Pembelajaran Siklus 1–4\n\nMelalui penyusunan e-portofolio dari Siklus 1 hingga Siklus 4, saya memperoleh pengalaman dan pembelajaran yang sangat berarti dalam mengembangkan kompetensi sebagai calon pendidik. Setiap siklus memberikan kesempatan bagi saya untuk merancang, melaksanakan, mengamati, dan mengevaluasi proses pembelajaran secara lebih terarah. Berbagai artefak yang telah dikumpulkan, mulai dari Rencana Pembelajaran Mendalam (RPM), bahan ajar, media pembelajaran, LKPD, video praktik pembelajaran, hingga hasil analisis setiap siklus, menjadi bukti perjalanan dan perkembangan saya dalam memahami bagaimana pembelajaran yang efektif seharusnya dirancang dan dilaksanakan.\n\nPada Siklus 1, pembelajaran matematika mengenai perkalian dan pembagian bilangan cacah menjadi pengalaman awal bagi saya dalam mengembangkan pembelajaran yang kontekstual melalui permasalahan sederhana dalam kehidupan sehari-hari. Melalui kegiatan pembagian benda secara sama rata, saya mulai memahami pentingnya menghubungkan materi pembelajaran dengan pengalaman nyata peserta didik. Dari hasil analisis, saya menyadari bahwa pembelajaran yang aktif dan kolaboratif perlu didukung oleh penggunaan benda konkret, kesesuaian instrumen asesmen dengan tujuan pembelajaran, serta kegiatan penutup dan refleksi yang lebih terarah. Pengalaman ini menjadi dasar bagi saya untuk memperbaiki perencanaan pembelajaran pada siklus berikutnya.\n\nPada Siklus 2, pembelajaran mengenai faktor dan kelipatan memberikan pengalaman baru dalam memanfaatkan media permainan edukatif, seperti Bus Pengangkut Faktor dan Kelipatan, Ular Tangga Penentu, serta Lingkaran Perasaan. Melalui artefak tersebut, saya belajar bahwa media pembelajaran tidak hanya berfungsi sebagai alat bantu penyampaian materi, tetapi juga dapat menciptakan suasana belajar yang lebih menyenangkan dan mendorong keterlibatan peserta didik. Hasil analisis menunjukkan bahwa kegiatan kolaboratif dan penggunaan media yang bervariasi telah memberikan ruang bagi peserta didik untuk berpartisipasi. Namun, saya juga menyadari bahwa pemerataan kesempatan belajar, kemampuan peserta didik dalam menjelaskan alasan matematis, dan pemberian umpan balik masih perlu ditingkatkan.\n\nPada Siklus 3, pembelajaran mengenai pecahan berpenyebut sama dan pecahan senilai mendorong saya untuk lebih memperhatikan keterpaduan antara tujuan pembelajaran, materi, media, dan asesmen. Penggunaan PowerPoint, kartu soal dan bonus, serta LKPD reguler dan inklusi memberikan pengalaman bagi saya dalam merancang pembelajaran yang lebih bervariasi dan memperhatikan kebutuhan peserta didik. Saya mulai memahami bahwa setiap peserta didik memiliki karakteristik dan kebutuhan belajar yang berbeda sehingga diperlukan strategi pembelajaran yang lebih fleksibel. Berdasarkan hasil analisis, saya menyadari bahwa penggunaan media visual perlu diimbangi dengan aktivitas diskusi, penalaran, dan pemecahan masalah yang lebih mendalam. Instruksi pada LKPD, penerapan tahapan model pembelajaran, serta kesesuaian materi dengan tujuan pembelajaran juga menjadi aspek yang perlu terus diperbaiki.\n\nSelanjutnya, pada Siklus 4, pembelajaran mengenai pecahan desimal, khususnya persepuluh dan perseratus, menjadi pengalaman yang memperkaya pemahaman saya dalam mengembangkan media pembelajaran yang lebih kreatif dan interaktif. Penggunaan PowerPoint yang dilengkapi ilustrasi, bahan ajar berbentuk infografis, serta permainan Spinner HERODES memberikan variasi pengalaman belajar bagi peserta didik. Saya semakin memahami pentingnya menyajikan konsep matematika yang abstrak melalui gambar, representasi visual, contoh konkret, dan permainan edukatif. Hasil analisis juga menyadarkan saya bahwa media yang menarik harus tetap memperhatikan kesesuaian materi dengan tujuan pembelajaran, pemerataan partisipasi, serta pemberian umpan balik dan asesmen individu. Dengan demikian, keberhasilan pembelajaran tidak hanya ditentukan oleh menariknya media, tetapi juga oleh bagaimana media tersebut membantu peserta didik membangun pemahaman yang bermakna.\n\nJika melihat keseluruhan perjalanan Siklus 1 hingga Siklus 4, saya merasakan adanya perkembangan dalam cara saya merancang dan memandang proses pembelajaran. Saya belajar bahwa menjadi seorang pendidik bukan hanya tentang menyampaikan materi dan memastikan peserta didik menyelesaikan tugas, melainkan juga tentang memahami kebutuhan belajar mereka, menciptakan lingkungan belajar yang kondusif, memilih strategi yang tepat, serta melakukan evaluasi secara berkelanjutan. Hasil analisis dari setiap siklus membantu saya mengenali kelebihan yang perlu dipertahankan sekaligus kekurangan yang harus diperbaiki. Saya juga semakin memahami bahwa pembelajaran yang berpusat pada peserta didik membutuhkan perencanaan yang matang, aktivitas yang bermakna, kesempatan berpartisipasi yang adil, dan asesmen yang mampu menggambarkan perkembangan belajar setiap individu.\n\nPada akhirnya, penyusunan e-portofolio ini bukan sekadar kegiatan mengumpulkan dokumentasi dan artefak pembelajaran, tetapi menjadi sarana refleksi untuk mengenali proses pertumbuhan dan perkembangan kompetensi saya sebagai calon pendidik. Setiap siklus memberikan pelajaran yang berbeda dan saling melengkapi, sehingga saya semakin menyadari bahwa proses menjadi guru yang profesional membutuhkan kemauan untuk terus belajar, terbuka terhadap masukan, berani mencoba inovasi, dan tidak berhenti melakukan perbaikan. Saya berharap pengalaman dan pembelajaran yang diperoleh melalui Siklus 1 hingga Siklus 4 dapat menjadi bekal untuk mengembangkan praktik pembelajaran yang lebih kreatif, inovatif, inklusif, dan bermakna bagi peserta didik di masa mendatang. Karena pada hakikatnya, guru yang baik bukanlah guru yang tidak pernah melakukan kesalahan, melainkan guru yang senantiasa mau belajar, merefleksikan, dan memperbaiki setiap proses pembelajaran demi memberikan pengalaman belajar terbaik bagi peserta didiknya.", {id:'n3',t:'Analisis Artefak Siklus 3: Pecahan Penyebut Sama & Senilai',s:'Analisis Siklus 3',i:'📊',c:'#ff9ec7',k:'ana'},
{id:'a4',t:'Artefak Siklus 4: Pecahan Desimal Persepuluh & Perseratus',s:'Artefak Siklus 4',i:'🔟',c:'#8fd3ff',k:'art'},
{id:'n4',t:'Analisis Artefak Siklus 4: Desimal Persepuluh & Perseratus',s:'Analisis Siklus 4',i:'🔬',c:'#ffd54f',k:'ana'},
{id:'end',t:'Penutup',i:'💌',c:'#b49bff',k:'end'}];
let EMB={};try{EMB=JSON.parse(document.getElementById('data').textContent)||{}}catch(e){}
let EDIT=false,S=JSON.parse(JSON.stringify(EMB));
S.d=S.d||{};
function loadDraft(){try{const l=JSON.parse(localStorage.getItem('ep')||'null');if(l)S=l}catch(e){}S.d=S.d||{}}
const save=()=>{if(!EDIT)return;try{localStorage.setItem('ep',JSON.stringify(S))}catch(e){alert('Penyimpanan penuh, coba gambar yang lebih kecil ya 🥺')}};
const $=s=>document.querySelector(s),esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
$('#fl').innerHTML=[...'🌸⭐🎈🍭🦄🌈☁️💖🐣🍓✨🧸'].map((e,i)=>`<span style="left:${i*8.5}%;animation-duration:${12+i%5*3}s;animation-delay:-${i*2}s">${e}</span>`).join('');
function title(){const t=S.title||'E-Portofolio PPG';$('#ttl').innerHTML=[...t].map((c,i)=>`<span style="animation-delay:${i*.08}s">${c==' '?'&nbsp;':esc(c)}</span>`).join('')}
title();
$('#ttl').onclick=()=>{if(!EDIT)return;const t=prompt('Ubah judul cover:',S.title||'E-Portofolio PPG');if(t){S.title=t;save();title()}};
function cimg(){const e=$('#cimg');if(S.cover){e.style.backgroundImage=`url(${S.cover})`;e.classList.add('has')}}
cimg();
function pick(cb){const f=$('#file');f.value='';f.onchange=()=>{if(!f.files[0])return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,900/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.72))};im.src=r.result};r.readAsDataURL(f.files[0])};f.click()}
$('#cimg').onclick=()=>EDIT&&pick(d=>{S.cover=d;save();cimg()});
$('#grid').innerHTML=APPS.map((a,i)=>`<button class="ico" data-id="${a.id}" style="animation-delay:${.3+i*.07}s"><div class="sq" style="background:${a.c};animation-delay:${i*.3}s">${a.i}</div><b>${a.s||a.t}</b></button>`).join('');
$('#grid').onclick=e=>{const b=e.target.closest('.ico');if(b)openApp(b.dataset.id,b)};
function sparkle(x,y){for(let i=0;i<8;i++){const s=document.createElement('div');s.className='spark';s.textContent=['⭐','💖','🌸','✨'][i%4];s.style.left=x+'px';s.style.top=y+'px';s.style.setProperty('--x',(Math.random()*160-80)+'px');s.style.setProperty('--y',(Math.random()*160-80)+'px');document.body.appendChild(s);setTimeout(()=>s.remove(),800)}}
const HOSTS=[['drive.google','📁','Google Drive','#4285f4'],['docs.google','📄','Google Docs','#4285f4'],['slides','📽️','Slides','#f4b400'],['youtu','▶️','YouTube','#ff0000'],['canva','🎨','Canva','#00c4cc'],['padlet','🗂️','Padlet','#e9467a'],['wordwall','🎲','Wordwall','#ff9800'],['genial','💫','Genially','#7c4dff'],['instagram','📷','Instagram','#e1306c'],['tiktok','🎵','TikTok','#333']];
function emblem(u){let h='';try{h=new URL(u).hostname.replace('www.','')}catch(e){}const m=HOSTS.find(x=>u.includes(x[0]));return m?{e:m[1],n:m[2],c:m[3],h}:{e:'🔗',n:h||'Tautan',c:'#8b7a9e',h}}
function sec(key,t,em){const L=S.d[key]||[];return `<div class="box"><h3>${em} ${t}</h3><div class="links">${L.map((u,i)=>{const m=emblem(u);return `<a class="lk" href="${esc(u)}" target="_blank" rel="noopener"><div class="em" style="background:${m.c}">${m.e}</div><div><b>${m.n}</b><small>${esc(m.h)}</small></div><button class="x" data-del="${key}|${i}">×</button></a>`}).join('')}</div>${L.length?'':'<p style="color:var(--soft);margin:0">Belum ada tautan.'+(EDIT?' Tempel link di bawah ya 👇':'')+'</p>'}<div class="row"><input placeholder="Tempel link ${t.toLowerCase()} (https://...)" data-add="${key}"><button class="btn" data-addb="${key}">+ Tambah</button></div></div>`}
function imgbox(key,lbl){const v=S.d[key];return `<div class="imgbox ${v?'has':''}" data-img="${key}" style="${v?`background-image:url(${v})`:''}"><span>${v?'🔄 Ganti gambar':'🖼️ '+lbl}</span></div>`}
function body(a){const p=a.id;
if(a.k==='id'){const f=[['nama','Nama lengkap'],['nim','NIM / Nomor peserta PPG'],['prodi','Program studi'],['pt','Perguruan tinggi penyelenggara'],['sekolah','Nama sekolah tempat PPL'],['kelas','Kelas yang diajar'],['tahun','Tahun pelaksanaan']];const v=S.d.foto;
return `<div class="box"><div class="avatar" data-img="foto" style="${v?`background-image:url(${v})`:''}">${v?'':'🧑‍🏫'}</div><p style="text-align:center;color:var(--soft);margin:0">Klik lingkaran untuk memilih foto profil</p>${f.map(x=>`<label>${x[1]}</label><input data-k="${x[0]}" value="${esc(S.d[x[0]])}" placeholder="Isi ${x[1].toLowerCase()}">`).join('')}</div>`}
if(a.k==='art')return sec(p+'m','Modul Ajar','📘')+sec(p+'d','Media Pembelajaran','🎬')+sec(p+'o','Dokumentasi','📸');
if(a.k==='ana')return `<div class="box"><h3>🖼️ Gambar Analisis</h3>${imgbox(p+'g','Klik untuk tambah gambar')}</div><div class="box"><h3>📝 Penjelasan Analisis</h3><textarea data-k="${p}t" placeholder="Tuliskan analisis artefak di sini...">${esc(S.d[p+'t'])}</textarea></div>`;
return `<div class="box"><div class="end">🎉🌈🎓</div><h3>💌 Kata Penutup</h3><textarea data-k="end" placeholder="Tulis refleksi, ucapan terima kasih, dan kesan penutup di sini...">${esc(S.d.end)}</textarea></div>`}
let cur=null;
function openApp(id,btn){const a=APPS.find(x=>x.id===id);cur=btn;const r=btn.querySelector('.sq').getBoundingClientRect(),v=$('#view'),x=r.left+r.width/2,y=r.top+r.height/2;
v.innerHTML=`<div class="bar"><h2>${a.i} ${a.t}</h2><button class="home">🏠 Home</button></div><div class="body">${body(a)}</div>`;
v.dataset.id=id;lock();v.style.display='block';v.scrollTop=0;sparkle(x,y);v.style.transformOrigin=`${x}px ${y}px`;
v.animate([{transform:'scale(.08)',borderRadius:'50px',opacity:0},{transform:'scale(1.03)',opacity:1,offset:.7},{transform:'scale(1)',borderRadius:'0',opacity:1}],{duration:550,easing:'cubic-bezier(.3,.9,.4,1)'});
document.body.style.overflow='hidden'}
function goHome(){const v=$('#view');if(cur){const r=cur.querySelector('.sq').getBoundingClientRect();v.style.transformOrigin=`${r.left+r.width/2}px ${r.top+r.height/2}px`}
v.animate([{transform:'scale(1)',opacity:1},{transform:'scale(.05)',opacity:0,borderRadius:'60px'}],{duration:420,easing:'cubic-bezier(.6,0,.8,.3)'}).onfinish=()=>{v.style.display='none';document.body.style.overflow=''}}
function refresh(){const v=$('#view'),a=APPS.find(x=>x.id===v.dataset.id),y=v.scrollTop,b=v.querySelector('.body');b.innerHTML=body(a);lock();b.style.animation='none';v.scrollTop=y}
const V=$('#view');
V.addEventListener('click',e=>{const t=e.target;
if(t.closest('.home'))return goHome();
const d=t.closest('[data-del]');if(d){e.preventDefault();const[k,i]=d.dataset.del.split('|');S.d[k].splice(+i,1);save();return refresh()}
const ab=t.closest('[data-addb]');if(ab){const k=ab.dataset.addb;let u=V.querySelector(`[data-add="${k}"]`).value.trim();if(!u)return;if(!/^https?:\/\//.test(u))u='https://'+u;(S.d[k]=S.d[k]||[]).push(u);save();return refresh()}
const im=t.closest('[data-img]');if(im&&EDIT)pick(x=>{S.d[im.dataset.img]=x;save();refresh()})});
V.addEventListener('input',e=>{const k=e.target.dataset.k;if(k){S.d[k]=e.target.value;save()}});
V.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.dataset.add)V.querySelector(`[data-addb="${e.target.dataset.add}"]`).click()});
function lock(){if(!EDIT)document.querySelectorAll('#view input,#view textarea').forEach(i=>i.readOnly=true)}
async function terbit(btn){const a=await claude.use('artifact');if(!a){alert('Fitur terbit tidak tersedia 🥺');return}
btn.textContent='⏳ Menerbitkan...';btn.disabled=true;
const json=JSON.stringify(S).replace(/</g,'\\u003c');
const html=SHELL.replace(/(<script type="application\/json" id="data">)[\s\S]*?(<\/script>)/,(m,x,y)=>x+json+y);
try{await a.publish(html);try{localStorage.removeItem('ep')}catch(e){}}catch(e){btn.textContent='🚀 Terbitkan';btn.disabled=false;alert('Gagal menerbitkan: '+((e&&e.message)||e.code||'coba lagi ya'))}}
(async()=>{try{const u=await claude.use('user');if(!u||!(u.isOwner()||u.canEdit()))return;
EDIT=true;document.body.classList.remove('ro');loadDraft();title();cimg();
const p=document.createElement('div');p.id='pub';p.innerHTML='<span>✏️ Mode edit</span><button class="btn">🚀 Terbitkan</button>';document.body.appendChild(p);
p.querySelector('button').onclick=e=>terbit(e.target)}catch(e){}})();
</script></body></html>
